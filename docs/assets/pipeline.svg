<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="tech6-cv-generator pipeline diagram">
  <title>tech6-cv-generator pipeline</title>
  <style>
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; rx: 10; }
    .box-main { fill: #eef4ff; stroke: #2b5ea7; stroke-width: 2; }
    .box-out { fill: #eef7ee; stroke: #2e7d32; stroke-width: 2; }
    .label { font-family: sans-serif; font-size: 15px; fill: #111; }
    .sub { font-family: sans-serif; font-size: 12.5px; fill: #444; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <!-- Inputs -->
  <rect class="box" x="10" y="30" width="200" height="70"/>
  <text class="label" x="110" y="58" text-anchor="middle">JSON expert data</text>
  <text class="sub" x="110" y="80" text-anchor="middle">canonical TECH-6 shape</text>
  <rect class="box" x="10" y="130" width="200" height="70"/>
  <text class="label" x="110" y="158" text-anchor="middle">Kosovo-style schema</text>
  <text class="sub" x="110" y="180" text-anchor="middle">expert_profile document</text>
  <!-- Mapper -->
  <path class="arrow" d="M 210 65 L 300 85"/>
  <path class="arrow" d="M 210 165 L 300 125"/>
  <rect class="box-main" x="300" y="70" width="220" height="70"/>
  <text class="label" x="410" y="98" text-anchor="middle">map_to_canonical</text>
  <text class="sub" x="410" y="120" text-anchor="middle">schema_mappers.py</text>
  <!-- Builder -->
  <path class="arrow" d="M 520 105 L 610 105"/>
  <rect class="box-main" x="610" y="70" width="200" height="70"/>
  <text class="label" x="710" y="98" text-anchor="middle">FormBuilder</text>
  <text class="sub" x="710" y="120" text-anchor="middle">form_builder.py</text>
  <!-- Outputs -->
  <path class="arrow" d="M 810 90 L 880 50"/>
  <path class="arrow" d="M 810 120 L 880 160"/>
  <text class="label" x="885" y="50" text-anchor="end" font-size="14">DOCX (TECH-6)</text>
  <text class="label" x="885" y="170" text-anchor="end" font-size="14">generation_report.json</text>
  <text class="sub" x="710" y="160" text-anchor="middle">missing fields highlighted in yellow</text>
  <!-- Extract branch -->
  <rect class="box" x="10" y="230" width="200" height="55"/>
  <text class="label" x="110" y="252" text-anchor="middle">PDF / DOCX resume</text>
  <text class="sub" x="110" y="272" text-anchor="middle">ingestor.py</text>
  <path class="arrow" d="M 210 257 L 300 257"/>
  <rect class="box" x="300" y="230" width="220" height="55"/>
  <text class="label" x="410" y="252" text-anchor="middle">extract command</text>
  <text class="sub" x="410" y="272" text-anchor="middle">plain text, for authoring JSON</text>
</svg>
